name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar enlaces y sintaxis
        run: npm run check
      - name: Linter de HTML y CSS
        run: npm run lint
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas
        run: npm test
